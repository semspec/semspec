name: Release

# A maintainer pushes a signed tag `v<version>` on the merged version commit.
# The workflow checks the tag, runs all gates of check.yml and makes the GitHub Release.
# It cannot check the key of the signature without a file .github/allowed_signers. When that file
# exists, `git tag -v` checks the key. Without it, the workflow checks only that a signature exists.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Check the tag and release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Fetch the tag object
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
      - name: Check that the tag is annotated and signed
        run: |
          [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ] || { echo "The tag ${TAG} is not an annotated tag."; exit 1; }
          git cat-file tag "refs/tags/${TAG}" | grep -Eq -- '-----BEGIN (SSH|PGP) SIGNATURE-----' || { echo "The tag ${TAG} has no signature."; exit 1; }
      - name: Check the signature key
        run: |
          if [ -f .github/allowed_signers ]; then
            git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/allowed_signers tag -v "${TAG}"
          else
            echo "No .github/allowed_signers file: the key is not checked."
          fi
      - name: Check that the tag is on master
        run: git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" origin/master || { echo "The tag ${TAG} is not on master."; exit 1; }
      - name: Check that the tag version is the package version
        run: |
          root=$(node -p "require('./package.json').version")
          core=$(node -p "require('./packages/core/package.json').version")
          [ "${TAG}" = "v${root}" ] || { echo "The tag ${TAG} is not v${root} (package.json)."; exit 1; }
          [ "${root}" = "${core}" ] || { echo "semspec ${root} and @semspec/core ${core} differ."; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm run licences
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check the requirements of Semspec
        run: node bin/semspec.js check --graph requirements/graph --profile requirements/profile.yaml
      - name: Check the spec document of the requirements
        run: node bin/semspec.js spec --graph requirements/graph --profile requirements/profile.yaml docs/reference/requirements.md --check
      - run: npm ci --prefix site
      - run: npm test --prefix site
      - name: Write the release notes
        run: node scripts/release-notes.mjs "${TAG#v}" > "${RUNNER_TEMP}/notes.md"
      - name: Make the GitHub Release
        run: gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
