name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm run licences
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check the requirements of Semspec
        run: node bin/semspec.js check --graph requirements/graph --profile requirements/profile.yaml
      - name: Check the spec document of the requirements
        run: node bin/semspec.js spec --graph requirements/graph --profile requirements/profile.yaml docs/reference/requirements.md --check
      - run: npm ci --prefix site
      - run: npm test --prefix site
