title: Workspace of several graphs
statement: A user keeps several graphs about 1 system, each with its own profile. A workspace shows them on 1 page, with a switch between them and links from a node of 1 graph to a node of another.
tagline: "Show several graphs on 1 page, each with its own profile. A node of 1 graph can link to a node of another."
