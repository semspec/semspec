id: req-pkg-cli
kind: requirement
title: Install 1 binary
state: draft
priority: now
statement: "The package cli is the 1 binary that users install. The command mcp is a subcommand of it."
capabilities:
  - cap-packages
area:
  - cli
acceptance:
  - id: one-binary
    text: "An install of the package cli gives the command semspec."
    status: partial
    tests:
      - type: unit
        file: test/packages.test.ts
        name: installs the run time dependencies of the mcp package
      - type: unit
        file: test/packages.test.ts
        name: is the package semspec with 1 bin that runs the built cli
      - type: unit
        file: test/packages.test.ts
        name: lists the built cli, the built app, the schemas and the licence files for the pack
      - type: unit
        file: test/packages.test.ts
        name: installs the run time dependencies of the cli
  - id: mcp-subcommand
    text: "The command semspec mcp starts the MCP server from the same binary."
    status: verified
    tests:
      - type: unit
        file: test/mcp.test.ts
        name: lists the tools and the resources, and answers each tool
  - id: help
    text: "The command semspec --help lists mcp with the other subcommands."
    status: verified
    tests:
      - type: unit
        file: test/mcp.test.ts
        name: lists mcp in the help text
