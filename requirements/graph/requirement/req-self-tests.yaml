id: req-self-tests
kind: requirement
title: Link every test to a condition
statement: Every test proves an acceptance condition, or has an exemption.
capabilities:
  - cap-self-check
area:
  - repository
acceptance:
  - id: linked
    text: "Every test is linked to an acceptance condition, or listed in 1 exemption file."
    status: verified
    tests:
      - type: unit
        file: test/self-check.test.ts
        name: reports a test with no link and no exemption, and accepts a linked test and an exempt test
      - type: unit
        file: test/self-check.test.ts
        name: reports an exemption that matches no test, and a missing report
  - id: reason
    text: "Each entry of the exemption file has a reason."
    status: verified
    tests:
      - type: unit
        file: test/self-check.test.ts
        name: reports an exemption with no reason or a blank reason, and does not let it exempt the test
  - id: finding
    text: "A test with no link and no exemption is a finding."
    status: verified
    tests:
      - type: unit
        file: test/self-check.test.ts
        name: reports a test with no link and no exemption, and accepts a linked test and an exempt test
      - type: unit
        file: test/self-check.test.ts
        name: reports a linked test name that no test of the report has
      - type: unit
        file: test/self-check.test.ts
        name: reports a link to a test file that does not exist, and ignores a link to a file of another suite
      - type: unit
        file: test/self-check.test.ts
        name: prints the findings as Markdown grouped by check, and as JSON with --json
