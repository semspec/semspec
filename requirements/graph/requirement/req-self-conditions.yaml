id: req-self-conditions
kind: requirement
title: Keep the status of the conditions honest
statement: The status of each condition, requirement and capability matches the work that is done.
capabilities:
  - cap-self-check
area:
  - repository
acceptance:
  - id: status
    text: "Every condition is verified, or partial with a note."
    status: verified
    tests:
      - type: unit
        file: test/self-check.test.ts
        name: reports a condition whose authored status differs from its derived status, and names both
      - type: unit
        file: test/self-check.test.ts
        name: does not compare the derived status when the evidence is stale or absent, and uses the authored status
      - type: unit
        file: test/self-check.test.ts
        name: reports a condition authored partial that has no note, and accepts one with a note
      - type: gate
        command: node scripts/self-check.mjs --only conditions
  - id: draft-verified
    text: "A requirement with state draft has at least 1 condition that is not verified."
    status: verified
    tests:
      - type: unit
        file: test/self-check.test.ts
        name: reports a draft requirement whose conditions are all verified, and accepts one with an open condition
      - type: gate
        command: node scripts/self-check.mjs --only conditions
  - id: stale-priority
    text: "A capability or requirement whose conditions are all verified has no priority."
    status: verified
    tests:
      - type: unit
        file: test/self-check.test.ts
        name: reports a requirement and a capability whose conditions are all verified and that still have a priority
      - type: gate
        command: node scripts/self-check.mjs --only conditions
