id: req-self-prepush
kind: requirement
title: Block a push that fails the checks
statement: A pre-push git hook runs the checks of the repository and blocks the push on a failure.
capabilities:
  - cap-self-check
area:
  - repository
acceptance:
  - id: checks
    text: "The hook runs the typecheck, the tests, semspec check on the requirements, semspec spec --check on the docs and npm run licences."
    status: verified
    tests:
      - type: unit
        file: test/prepush.test.ts
        name: is an executable POSIX shell script
      - type: unit
        file: test/prepush.test.ts
        name: runs the typecheck, the tests, semspec check, semspec spec --check and the licence check, then the self-check
      - type: gate
        command: sh .githooks/pre-push
  - id: block
    text: "The hook blocks the push when 1 of these checks fails."
    status: verified
    tests:
      - type: unit
        file: test/prepush.test.ts
        name: blocks the push and stops at the first failed step
      - type: gate
        command: sh .githooks/pre-push
  - id: install
    text: "A contributor installs the hook once with 1 npm script."
    status: verified
    tests:
      - type: unit
        file: test/prepush.test.ts
        name: installs the hook with 1 npm script that sets the hooks path
      - type: gate
        command: sh .githooks/pre-push
  - id: dependency
    text: "An install of Semspec as a dependency never installs a hook."
    status: verified
    tests:
      - type: unit
        file: test/prepush.test.ts
        name: keeps the hook out of every lifecycle script and out of the published files
      - type: gate
        command: sh .githooks/pre-push
  - id: isolated
    text: "The hook clears the repository variables that git passes to a hook, such as GIT_DIR and GIT_INDEX_FILE, before it runs a check, so a test that makes a temporary repository never changes the repository of the contributor."
    status: open
