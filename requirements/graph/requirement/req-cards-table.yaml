id: req-cards-table
kind: requirement
title: List nodes in Cards and Table
statement: Cards and the Table list the nodes of the scope. The Table has a column for each field filter and pins its header.
capabilities:
  - cap-cards-table
area:
  - app
acceptance:
  - id: chips
    text: A card shows the chips that the profile names for its kind.
    status: verified
    tests:
      - type: unit
        file: test/core.test.ts
        name: shows the chips that the profile names for each kind
  - id: table
    text: The Table shows the columns, filters and pinned header.
    status: verified
    tests:
      - type: unit
        file: test/app/panels.test.tsx
        name: has a column for each field filter and pins its header
      - type: unit
        file: test/app/panels.test.tsx
        name: takes the field filter columns of the profile
      - type: unit
        file: test/app/panels.test.tsx
        name: filters the rows with a column filter
  - id: table-resize
    text: Every column of the Table is resizable with a handle, the arrow keys or a double click that resets it. The widths have a minimum and persist per graph.
    status: verified
    tests:
      - type: unit
        file: test/app/table-resize.test.tsx
        name: gives Title its default width and a handle
      - type: unit
        file: test/app/table-resize.test.tsx
        name: resizes with the arrow keys and holds the minimum
      - type: unit
        file: test/app/table-resize.test.tsx
        name: resets a column with a double click
      - type: unit
        file: test/app/table-resize.test.tsx
        name: saves the widths in the store and loads them again
  - id: resize-no-select
    text: "A drag of a column resize handle selects no text on the page, in Safari, Chrome and Firefox."
    status: partial
    note: "Checked in jsdom only. Only a real Safari proves the visual result."
    tests:
      - type: unit
        file: test/app/table-resize.test.tsx
        name: stops the text selection during a handle drag and restores it after
      - type: unit
        file: test/app/table-resize.test.tsx
        name: restores the body styles when the touch ends
