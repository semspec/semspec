id: req-phone-sheets
kind: requirement
title: Open the tree and the details in a sheet
state: draft
priority: later
statement: "At phone width the tree and the details panel open in a sheet."
capabilities:
  - cap-phone-layout
area:
  - app
acceptance:
  - id: tree-sheet
    text: "A toolbar button opens the tree in a sheet."
    status: verified
    tests:
      - type: unit
        file: test/app/phone.test.tsx
        name: opens the tree in a sheet with a toolbar button
  - id: details-sheet
    text: "A toolbar button opens the details panel in a sheet."
    status: verified
    tests:
      - type: unit
        file: test/app/phone.test.tsx
        name: opens the details panel in a sheet with a toolbar button
      - type: unit
        file: test/app/phone.test.tsx
        name: opens the details sheet when a node is picked
  - id: close
    text: "A sheet closes with its close button, with the Escape key and by a tap outside it."
    status: verified
    tests:
      - type: unit
        file: test/app/phone.test.tsx
        name: closes a sheet with its close button
      - type: unit
        file: test/app/phone.test.tsx
        name: closes a sheet with the Escape key
      - type: unit
        file: test/app/phone.test.tsx
        name: closes a sheet with a tap outside it
