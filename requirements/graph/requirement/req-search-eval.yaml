id: req-search-eval
kind: requirement
title: Measure search with an evaluation set
state: draft
priority: next
statement: "A set of questions with expected nodes measures the recall of the search."
capabilities:
  - cap-search
area:
  - core
acceptance:
  - id: eval-set
    text: "The evaluation set is a file of questions. Each question lists the expected node ids."
    status: open
  - id: recall
    text: "A test computes the recall at a fixed rank for the evaluation set and fails when the recall falls below a set value."
    status: open
  - id: two-profiles
    text: "The evaluation set has questions for at least 2 profiles."
    status: open
