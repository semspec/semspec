id: req-gate-hooks
kind: requirement
title: Run the gate in the workflow
state: draft
priority: later
statement: The check runs as an agent hook, a pre-commit hook and a CI step.
capabilities:
  - cap-gate
area:
  - harness
acceptance:
  - id: agent-hook
    text: An agent hook runs the check after a change.
    status: partial
    tests:
      - type: unit
        file: test/check.test.ts
        name: runs the agent hook script of the guide for a file inside and a file outside the graph folder
      - type: unit
        file: test/check.test.ts
        name: has a settings example of the guide that runs the script after Write and Edit
  - id: pre-commit
    text: A pre-commit hook runs the check.
    status: verified
    tests:
      - type: unit
        file: test/check.test.ts
        name: runs the pre-commit script of the guide against a git repository and blocks a broken commit
  - id: ci
    text: A CI step runs the check.
    status: verified
    tests:
      - type: unit
        file: test/check.test.ts
        name: has a workflow for this repository that runs the check on the requirements with pinned actions
  - id: ci-node
    text: "CI runs the node tests on the lowest Node version that the engines field of the package allows, and all tests, the build and the site on a Node version that every test tool supports."
    status: verified
    tests:
      - type: unit
        file: test/ci.test.ts
        name: runs the node tests on the lowest Node version of the engines field
      - type: unit
        file: test/ci.test.ts
        name: runs all tests, the build and the site on a Node version that the test tools support
