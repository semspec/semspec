id: req-search-synonyms
kind: requirement
title: Widen the query with synonyms
state: draft
statement: "The query widens with synonyms from the vocabularies and the terms."
capabilities:
  - cap-search
area:
  - core
acceptance:
  - id: alt-labels
    text: "A query term that matches a vocabulary term also searches the altLabels of that term."
    status: verified
    tests:
      - type: unit
        file: test/search.test.ts
        name: widens the query with the alt labels of a concept
  - id: avoid-lists
    text: "A query term that matches a term with an avoid list also searches the words of the avoid list."
    status: verified
    tests:
      - type: unit
        file: test/search.test.ts
        name: widens the query with the synonym fields of the profile
  - id: weight
    text: "A synonym counts less than the word in the query."
    status: verified
    tests:
      - type: unit
        file: test/search.test.ts
        name: counts a synonym less than the word of the query
