id: req-phone-touch
kind: requirement
title: Support touch on the canvas
state: draft
priority: later
statement: "The canvas supports touch pan and pinch zoom."
capabilities:
  - cap-phone-layout
area:
  - app
acceptance:
  - id: pan
    text: "A 1 finger drag on the canvas pans the Graph view."
