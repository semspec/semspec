id: req-pkg-split
kind: requirement
title: Split the code into 4 packages
statement: "The code splits into the packages core, app, mcp and cli."
capabilities:
  - cap-packages
area:
  - core
acceptance:
  - id: four-packages
    text: "The repository has the 4 packages core, app, mcp and cli, each with its own package.json."
    status: verified
    tests:
      - type: unit
        file: test/packages.test.ts
        name: has the packages core, app, mcp and cli, each with its own package.json
  - id: dependency-direction
    text: "The packages app, mcp and cli depend on core. The package core depends on none of them."
    status: verified
    tests:
      - type: unit
        file: test/packages.test.ts
        name: lets no package import from a package that it must not depend on
      - type: unit
        file: test/packages.test.ts
        name: lists the packages that a package imports in its package.json
  - id: dependency-test
    text: "A test fails when a package imports from a package that it must not depend on."
    status: verified
    tests:
      - type: unit
        file: test/packages.test.ts
        name: lets no package import from a package that it must not depend on
      - type: unit
        file: test/packages.test.ts
        name: detects an import of a package that is not allowed
