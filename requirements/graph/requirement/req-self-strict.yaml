id: req-self-strict
kind: requirement
title: Gate each change with the self-check
statement: The self-check is a gate of CI and of the pre-push hook. A finding that is not in the baseline fails the gate. The baseline holds the backlog of findings, and it only shrinks.
rationale: "Features were built before their requirements, and no gate stopped it. A gate with a baseline stops each new gap at once, and the old backlog blocks nothing."
capabilities:
  - cap-self-check
area:
  - repository
acceptance:
  - id: baseline
    text: "A baseline file lists the findings of the backlog by check and by a stable key. A command writes it from the current findings."
    status: verified
    tests:
      - type: unit
        file: test/self-check.test.ts
        name: gives each finding a stable key of its check and its subject
      - type: unit
        file: test/self-check.test.ts
        name: keeps the keys when an unrelated part of the repository changes
      - type: unit
        file: test/self-check.test.ts
        name: gives each finding of the surface check a key of its kind and its name
      - type: unit
        file: test/self-check.test.ts
        name: writes the baseline with the sorted keys of the findings by check, and prints the size of each check
      - type: unit
        file: test/self-check.test.ts
        name: writes the baseline to the default file of the root
      - type: unit
        file: test/self-check.test.ts
        name: keeps the keys of the checks that did not run when it writes the baseline with --only
      - type: gate
        command: node scripts/self-check.mjs
  - id: ci
    text: "CI runs the self-check as a gate against the baseline. A finding that is not in the baseline fails the CI workflow, and the message names it."
    status: verified
    tests:
      - type: unit
        file: test/self-check.test.ts
        name: exits 1 for a finding that is not in the baseline, and names it and its key
      - type: unit
        file: test/self-check.test.ts
        name: exits 0 when every finding is in the baseline
      - type: unit
        file: test/self-check.test.ts
        name: gates on the default baseline file of the root when it exists, and runs in report mode when it does not
      - type: unit
        file: test/self-check.test.ts
        name: exits 2 for an unreadable baseline or a baseline that is not an object of lists of keys
      - type: unit
        file: test/self-check.test.ts
        name: runs the self-check as a gate against the baseline in the CI workflow, after the test evidence
      - type: unit
        file: test/self-check.test.ts
        name: fails the gate of the CI step with exit code 1 for a finding that is not in the baseline
      - type: gate
        command: node scripts/self-check.mjs
  - id: hook
    text: "The pre-push hook runs the same gate, and a finding that is not in the baseline blocks the push."
    status: verified
    tests:
      - type: unit
        file: test/prepush.test.ts
        name: runs the self-check as a gate against the baseline, not in report mode
      - type: unit
        file: test/prepush.test.ts
        name: blocks the push when the self-check finds a finding that is not in the baseline
      - type: gate
        command: sh .githooks/pre-push
  - id: shrink
    text: "A baseline entry that is no longer a finding is reported as fixed. The gate fails when a change adds an entry to the baseline, so the baseline only shrinks."
    status: verified
    tests:
      - type: unit
        file: test/self-check.test.ts
        name: reports a baseline key that is no longer a finding as fixed, and exits 0
      - type: unit
        file: test/self-check.test.ts
        name: does not report the keys of a check that did not run as fixed
      - type: unit
        file: test/check-baseline.test.ts
        name: fails when the pull request adds a key to the baseline, and names each added key
      - type: unit
        file: test/check-baseline.test.ts
        name: passes when the pull request removes a key, and says how many
      - type: unit
        file: test/check-baseline.test.ts
        name: passes when the baseline does not change
      - type: unit
        file: test/check-baseline.test.ts
        name: fails for a key that moves to another check, because the key is new there
      - type: unit
        file: test/check-baseline.test.ts
        name: passes when the base has no baseline file, because the pull request introduces it
      - type: unit
        file: test/check-baseline.test.ts
        name: fails when the pull request deletes the baseline file that the base has
      - type: unit
        file: test/check-baseline.test.ts
        name: exits with 2 for an unknown base ref, no base ref and a baseline that is not valid
      - type: unit
        file: test/check-baseline.test.ts
        name: reads the keys of an object of lists of text keys, and rejects any other shape
      - type: unit
        file: test/requirement-change.test.ts
        name: runs the check of the baseline against the base branch in the pull request job
      - type: gate
        command: node scripts/check-baseline.mjs origin/master
  - id: gate-check
    text: "Each condition of the self-check requirements links the gate as a check of the type gate, with the command that runs it, next to the unit tests of the script."
    status: verified
    tests:
      - type: unit
        file: test/self-check.test.ts
        name: links a check of the type gate with a command to each condition of the self-check requirements, next to its unit tests
      - type: unit
        file: test/evidence.test.ts
        name: ignores a check of a type that no adapter answers, and keeps a condition with no answered check not-run
      - type: unit
        file: test/build.test.ts
        name: points every test reference at an existing test with that exact title
      - type: gate
        command: node bin/semspec.js check --graph requirements/graph --profile requirements/profile.yaml
