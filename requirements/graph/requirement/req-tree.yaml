id: req-tree
kind: requirement
title: Show the hierarchy tree
statement: The tree shows each node under its parent and groups the nodes that the profile marks as unplaced.
capabilities:
  - cap-tree-graph
area:
  - app
acceptance:
  - id: logic
    text: The placement of the nodes follows the profile.
    status: verified
    tests:
      - type: unit
        file: test/core.test.ts
        name: puts a node that follows another node under it, and keeps every parent field for the scope
  - id: ui
    text: The tree selects a node as the scope.
    status: verified
    tests:
      - type: unit
        file: test/app/panels.test.tsx
        name: selects a node of the product fixture as the scope
      - type: unit
        file: test/app/panels.test.tsx
        name: selects a node of the safety fixture as the scope
      - type: unit
        file: test/app/panels.test.tsx
        name: removes the scope with the button of the chip
  - id: sub-heading-indent
    text: A root under a sub-heading of its kind sits 1 level below the sub-heading, and its children follow from there. A tree with 1 root kind keeps its roots at the left edge.
    status: verified
    tests:
      - type: unit
        file: test/app/tree-depth.test.tsx
        name: puts a root under a sub-heading 1 level below it, and its child 1 level further
      - type: unit
        file: test/app/tree-depth.test.tsx
        name: keeps the depth of the roots and the lines after a search filter
      - type: unit
        file: test/app/tree-depth.test.tsx
        name: keeps depth 0 for the roots of a tree with 1 root kind
