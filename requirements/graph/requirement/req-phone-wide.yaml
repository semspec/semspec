id: req-phone-wide
kind: requirement
title: Keep the layout from 768 px
state: draft
priority: later
statement: "The layout from 768 px wide up does not change."
capabilities:
  - cap-phone-layout
area:
  - app
acceptance:
  - id: wide-same
    text: "At 768 px wide and above, the tree and the details panel stay in their side panels and no sheet button shows."
    status: verified
    tests:
      - type: unit
        file: test/phone-layout.test.ts
        name: uses the phone layout below 768 px only
      - type: unit
        file: test/app/phone.test.tsx
        name: keeps the tree and the details panel in their side panels and shows no sheet button
      - type: unit
        file: test/app/phone.test.tsx
        name: closes an open sheet when the viewport grows to the desktop layout
