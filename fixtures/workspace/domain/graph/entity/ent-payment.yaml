id: "ent-payment"
kind: "entity"
term: "Payment"
definition: "A transfer of money for one order. It is the aggregate root."
role: "Aggregate root"
avoid: ["transaction"]
partOf: ["agg-payment"]
refs:
  - { to: ent-order, relation: "refers to" }
  - { to: vo-money, relation: "has amount" }
  - { to: vo-card-details, relation: "is paid with" }
anchors:
  - std-pay: { element: "Amount" }
  - std-ccy: { element: "Currency code" }
